[logger]
messageFormat = "[%(asctime)s] [%(name)s/%(levelname)s]: %(message)s"

[server]
address = "127.0.0.1"
port = 8501
enableStaticServing = true
sslCertFile = '.streamlit/full_chain.pem'
sslKeyFile = '.streamlit/private.key'
enableCORS = false
enableXsrfProtection = false

[theme]
primaryColor = "#F062A1"
textColor = "#303030"
